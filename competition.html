<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفاتيح القرآن الكريم</title><style>body{font-family:Arial;background:#f4f1e7;color:#17372e;margin:0}header{padding:16px;background:#0b5b46;color:#fff;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border-radius:16px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.btn{padding:9px 12px;border:1px solid #d9ddd8;border-radius:9px;background:#fff;color:#0b5b46;font-weight:700;cursor:pointer}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}.reader{font-size:24px;line-height:2.2}.ayah{padding:14px 0;border-bottom:1px dashed #ddd}.ayah.selected{background:#edf5ef}.hidden{display:none}.paper{background:#fbf6e8;border:1px solid #cbbd99;padding:20px;font-size:25px;line-height:2.5;min-height:400px}footer{padding:25px;background:#06382e;color:#fff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.reader{font-size:21px}.paper{font-size:22px}}</style><body><header><b>﷽ مفاتيح القرآن الكريم</b><div>المنشئ والمطور: محمد شعبان محارب</div></header><main><section class="hero"><h1>مفاتيح القرآن الكريم</h1><p>قراءة السور، البحث في الآيات، التفسير، الاستماع المتسلسل، وتصفح صفحات المصحف.</p><form id="searchForm" class="search"><input id="q" placeholder="ابحث عن الرحمة أو التقوى أو مصر..."><button class="btn">بحث</button></form></section><section id="quran"><h2>المصحف الشريف</h2><div class="card"><button class="btn" id="openPage">📕 افتح المصحف</button> <button class="btn" id="resume">🔖 متابعة</button><div id="mushaf"></div></div><div id="surahGrid" class="grid"></div><div id="reader" class="card hidden"></div></section><section><h2>موضوعات</h2><div id="topicGrid" class="grid"></div><div id="results" class="card hidden"></div></section><section><h2>قصص الأنبياء</h2><div id="prophets" class="grid"></div></section><section><h2>الموسوعة الإسلامية</h2><div id="islam" class="grid"></div></section></main><footer>مفاتيح القرآن الكريم — المنشئ والمطور: محمد شعبان محارب</footer><audio id="audio" controls style="display:none;position:fixed;bottom:10px;left:10px;right:10px"></audio><script>const API='https://api.alquran.cloud/v1';const N=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];const TOP=['الرحمة','التقوى','الصبر','الجنة','النار','العدل','الإحسان','الصدق','المغفرة','الدعاء','العلم','الوالدين','التوبة','الآخرة','مصر'];const P=['آدم','إدريس','نوح','هود','صالح','إبراهيم','لوط','إسماعيل','إسحاق','يعقوب','يوسف','شعيب','أيوب','ذو الكفل','موسى','هارون','داود','سليمان','إلياس','اليسع','يونس','زكريا','يحيى','عيسى','محمد ﷺ'];const I=[['الصلاة','أركان الصلاة والسنن والطهارة.'],['الوضوء والغسل','خطوات الوضوء والغسل والأحكام العامة.'],['الصيام ورمضان','الصوم والسحور والإفطار والقيام.'],['الزكاة','معناها وأبوابها العامة.'],['الحج والعمرة','الإحرام والطواف والسعي وعرفة.'],['الحديث الشريف','الصحيح والحسن والضعيف والإسناد والمتن والتخريج.'],['علوم القرآن','المكي والمدني وأسباب النزول وجمع المصحف.'],['التجويد','المخارج والصفات وأحكام النون والميم والمدود.'],['العقيدة','أركان الإسلام والإيمان والتوحيد.'],['الأخلاق','الرحمة والصدق والأمانة وبر الوالدين.'],['الغزوات','بدر وأحد والخندق وخيبر والحديبية وفتح مكة وحنين وتبوك.'],['الفتوحات والتاريخ','الخلفاء والدول الإسلامية والأندلس والحضارة.']];const audio=document.getElementById('audio');let playlist=[],pi=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(API+p);if(!r.ok)throw Error();return(await r.json()).data}function listen(u){if(!u)return;audio.style.display='block';audio.src=u;audio.play().catch(()=>{})}async function playSurah(id){try{const d=await api('/surah/'+id+'/ar.alafasy');playlist=d.ayahs;pi=0;audio.style.display='block';audio.onended=()=>{if(pi<playlist.length){audio.src=playlist[pi++].audio;audio.play().catch(()=>{})}};audio.src=playlist[pi++].audio;audio.play().catch(()=>{})}catch(e){alert('تعذر تشغيل التلاوة الآن')}}function renderSurahs(arr){const g=document.getElementById('surahGrid');g.innerHTML=arr.map(n=>{const id=N.indexOf(n)+1;return '<article class="card"><h3>'+id+'. '+n+'</h3><button class="btn" data-read="'+id+'">📖 قراءة</button> <button class="btn" data-play="'+id+'">▶ استماع</button></article>'}).join('');g.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>openSurah(+b.dataset.read));g.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSurah(+b.dataset.play))}renderSurahs(N);async function openSurah(id){const r=document.getElementById('reader');r.classList.remove('hidden');r.innerHTML='<h2>سورة '+N[id-1]+'</h2><p>جارٍ التحميل…</p>';try{const d=await api('/surah/'+id+'/quran-uthmani');r.innerHTML='<h2>سورة '+d.name+'</h2><button class="btn" id="splay">▶ تشغيل السورة</button> <button class="btn" id="sclose">إغلاق</button><div id="ayahs" class="reader"></div>';document.getElementById('splay').onclick=()=>playSurah(id);document.getElementById('sclose').onclick=()=>r.classList.add('hidden');document.getElementById('ayahs').innerHTML=d.ayahs.map(a=>'<div class="ayah"><div>'+esc(a.text)+' ﴿'+a.numberInSurah+'﴾</div><small>صفحة '+a.page+' • جزء '+a.juz+'</small><br><button class="btn ay" data-u="'+(a.audio||'')+'">🔊 الآية</button> <button class="btn tf" data-s="'+id+'" data-a="'+a.numberInSurah+'">📚 التفسير</button><div class="tafsir"></div></div>').join('');r.querySelectorAll('.ayah').forEach(x=>x.onclick=()=>{r.querySelectorAll('.ayah').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});r.querySelectorAll('.ay').forEach(b=>b.onclick=e=>{e.stopPropagation();listen(b.dataset.u)});r.querySelectorAll('.tf').forEach(b=>b.onclick=e=>{e.stopPropagation();tafsir(+b.dataset.s,+b.dataset.a,b)})}catch(e){r.innerHTML='<p>تعذر التحميل.</p>'}}async function tafsir(s,a,b){const x=b.parentElement.querySelector('.tafsir');x.textContent='جارٍ تحميل التفسير…';try{const j=await fetch('https://quranenc.com/api/v1/translation/aya/arabic_moyassar/'+s+'/'+a).then(r=>r.json());x.textContent=j.result?.translation||j.translation||'لم يتوفر التفسير الآن'}catch(e){x.textContent='تعذر تحميل التفسير'}}async function searchQ(q){const box=document.getElementById('results');box.classList.remove('hidden');box.innerHTML='<h3>نتائج «'+esc(q)+'»</h3><p>جارٍ البحث…</p>';try{const d=await api('/search/'+encodeURIComponent(q)+'/all/ar');const m=(d.matches||[]).filter(x=>x.edition?.type==='quran');box.innerHTML='<h3>نتائج «'+esc(q)+'»</h3>'+(m.length?m.slice(0,100).map(x=>'<div class="result"><b>'+esc(x.surah.name)+' — آية '+x.numberInSurah+'</b><br>'+esc(x.text)+'</div>').join(''):'<p>لا توجد نتائج.</p>')}catch(e){box.innerHTML='<p>تعذر البحث الآن.</p>'}}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();searchQ(document.getElementById('q').value)};document.getElementById('topicGrid').innerHTML=TOP.map(t=>'<article class="card"><h3>'+t+'</h3><button class="btn tq" data-q="'+t+'">عرض الآيات</button></article>').join('');document.querySelectorAll('.tq').forEach(b=>b.onclick=()=>searchQ(b.dataset.q));document.getElementById('prophets').innerHTML=P.map((p,i)=>'<article class="card"><h3>'+p+'</h3><p>عرض مواضع النبي في القرآن.</p><button class="btn ps" data-n="'+i+'">فتح</button></article>').join('');document.querySelectorAll('.ps').forEach(b=>b.onclick=()=>searchQ(P[+b.dataset.n].split(' ')[0]));document.getElementById('islam').innerHTML=I.map((x,i)=>'<article class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><button class="btn sec" data-i="'+i+'">فتح القسم</button></article>').join('');document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>alert(I[+b.dataset.i][0]+'\n\n'+I[+b.dataset.i][1]));async function page(p){p=Math.max(1,Math.min(604,+p||1));localStorage.setItem('mkm-page',p);const m=document.getElementById('mushaf');m.innerHTML='<div class="tools"><button class="btn" id="prev">➡️ السابقة</button><input id="pn" value="'+p+'" type="number" min="1" max="604"><button class="btn" id="next">التالية ⬅️</button></div><div class="paper" id="pt">جارٍ تحميل الصفحة…</div>';document.getElementById('prev').onclick=()=>page(p-1);document.getElementById('next').onclick=()=>page(p+1);document.getElementById('pn').onchange=e=>page(e.target.value);try{const d=await api('/page/'+p+'/quran-uthmani');document.getElementById('pt').innerHTML=d.ayahs.map(a=>esc(a.text)+' ﴿'+a.numberInSurah+'﴾').join(' ')}catch(e){document.getElementById('pt').textContent='تعذر تحميل الصفحة الآن'}}document.getElementById('openPage').onclick=()=>page(1);document.getElementById('resume').onclick=()=>page(localStorage.getItem('mkm-page')||1);document.getElementById('surahSelect')?.remove();</script></body></html>
