<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصص الأنبياء | مفاتيح القرآن الكريم</title><style>body{margin:0;background:#f7f4ec;color:#17352a;font-family:Tahoma,Arial}.head{background:#075c46;color:#fff;padding:35px 6%}.head h1{font-size:42px;margin:0 0 10px}.head p{line-height:2}.back{display:inline-block;background:#c49a45;color:#fff;padding:10px 16px;border-radius:12px;text-decoration:none}main{max-width:1100px;margin:auto;padding:28px 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.story{background:#fffdf8;border:1px solid #e5ddce;border-radius:20px;padding:20px}.card{cursor:pointer;text-align:right}.card b{font-size:20px;color:#075c46}.card small{display:block;margin-top:8px;color:#65736c}.story{display:none;margin-top:22px}.story.open{display:block}.story h2{color:#075c46}.story p{line-height:2.15;font-size:18px}.video{position:relative;padding-top:56.25%;margin-top:20px;background:#111;border-radius:18px;overflow:hidden}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}.head h1{font-size:32px}} </style><header class="head"><h1>قصص الأنبياء في القرآن</h1><p>اقرأ مادة تعريفية عن الأنبياء، وتعرّف على السور التي وردت فيها قصصهم. اضغط على الاسم لفتح القصة والفيديو داخل الموقع.</p><a class="back" href="./">← العودة إلى مفاتيح القرآن</a></header><main><div id="grid" class="grid"></div><article id="story" class="story"><h2 id="title"></h2><div id="text"></div><p id="refs"></p><div class="video"><iframe id="video" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div></article></main><script>const P=[['آدم عليه السلام','خلق الله آدم وأسكنه الجنة، ثم وقع الابتلاء فأكل من الشجرة وتاب، وجعل الله قصته بداية لتعلم الإنسان معنى التكليف والتوبة.','البقرة، الأعراف، طه، ص'],['نوح عليه السلام','دعا قومه إلى عبادة الله زمنًا طويلًا، فكذبوه، وأمره الله بصناعة السفينة، فنجا هو ومن آمن معه وأُغرق المكذبون.','هود، المؤمنون، الشعراء، القمر، نوح'],['إبراهيم عليه السلام','واجه عبادة الأصنام، وحاج قومه في التوحيد، ونجاه الله من النار، وهاجر، وجاءت منه ذرية الأنبياء، وشارك إسماعيل في رفع قواعد البيت.','البقرة، الأنعام، هود، إبراهيم، مريم، الأنبياء، الصافات'],['لوط عليه السلام','دعا قومه إلى الطهارة وترك الفواحش، فلما أصروا على التكذيب جاء أمر الله فنجا لوط ومن آمن معه إلا امرأته.','الأعراف، هود، الحجر، الأنبياء، النمل، العنكبوت'],['يوسف عليه السلام','بدأت القصة برؤيا يوسف، ثم كيد إخوته وإلقاؤه في الجب، وبيعه، وابتلاؤه في مصر والسجن، ثم التمكين وتأويل الرؤى وعودة الأسرة واجتماعها.','سورة يوسف كاملة'],['شعيب عليه السلام','دعا قوم مدين إلى التوحيد والعدل في الكيل والميزان ونهاهم عن الفساد في الأرض، فلما كذبوه جاءت عاقبة المكذبين.','الأعراف، هود، الشعراء، العنكبوت'],['أيوب عليه السلام','ابتُلي أيوب ابتلاء شديدًا، فصبر ولجأ إلى ربه، فاستجاب الله له وكشف ضره ورد عليه أهله ومثلهم معهم.','الأنبياء، ص'],['موسى عليه السلام','من أكثر الأنبياء ذكرًا في القرآن: ولادته، تربيته، خروجه من مصر، تكليفه بالرسالة، مواجهته فرعون، نجاة بني إسرائيل، ثم أحداث الطور والميقات.','البقرة، الأعراف، يونس، طه، الشعراء، القصص وغيرها'],['داود عليه السلام','آتاه الله الملك والحكمة والزبور، وسخر له الجبال والطير، وعلّمه صنعة الدروع، وذكر القرآن قصة الخصمين وما فيها من عبر.','البقرة، النساء، المائدة، الأنبياء، سبأ، ص'],['سليمان عليه السلام','آتاه الله ملكًا عظيمًا وسخر له الريح والجن وفهم منطق الطير، ومن أشهر قصصه قصة ملكة سبأ.','الأنبياء، النمل، سبأ، ص'],['يونس عليه السلام','خرج من قومه، فكان ابتلاؤه في بطن الحوت، فنادى ربه في الظلمات فاستجاب الله له ونجاه، ثم آمن قومه.','يونس، الأنبياء، الصافات، القلم'],['زكريا ويحيى عليهما السلام','دعا زكريا ربه بالذرية فبشره الله بيحيى، الذي وصفه القرآن بالحنان والتقوى والحكم صبيًا.','آل عمران، مريم، الأنبياء'],['عيسى عليه السلام','ولد عيسى من مريم بمعجزة، وتكلم في المهد، وأرسله الله إلى بني إسرائيل، وأيده بآيات بإذن الله، ويعرض القرآن مكانته وعلاقته بالتوحيد.','آل عمران، النساء، المائدة، مريم، الصف'],['محمد ﷺ','خاتم الأنبياء، أرسله الله بالهدى ودين الحق، ودعا إلى التوحيد، وواجه التكذيب، وهاجر، وأقام مجتمع المدينة، وبلغ الرسالة. يذكر القرآن سيرته في مشاهد ومواقف مرتبطة بالهداية والتربية والجهاد والأخلاق.','العلق، المدثر، المزمل، الضحى، الأحزاب، محمد، الفتح، التوبة، الأنفال، النور وغيرها']];const g=document.getElementById('grid');P.forEach((x,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<b>'+x[0]+'</b><small>'+x[2]+'</small>';b.onclick=()=>show(i);g.appendChild(b)});function show(i){let x=P[i];title.textContent='قصة '+x[0];text.innerHTML='<p>'+x[1]+'</p>';refs.innerHTML='<strong>مواضع القصة:</strong> '+x[2]+'<br><br>المادة المعروضة هنا تعريف قرآني مختصر، ويمكن فتح السور والآيات المرتبطة بها من قسم المصحف.';video.src='https://www.youtube.com/embed?listType=search&list='+encodeURIComponent('قصة '+x[0]);story.classList.add('open');story.scrollIntoView({behavior:'smooth'})}</script></html>
