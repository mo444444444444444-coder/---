<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="التفسير الميسر داخل مفاتيح القرآن الكريم"><title>التفسير | مفاتيح القرآن الكريم</title><style>body{margin:0;background:#f7f4ec;color:#17352a;font-family:Tahoma,Arial}.head{background:#075c46;color:#fff;padding:32px 6%}.head h1{margin:0 0 10px}.back{display:inline-block;background:#c49a45;color:#fff;padding:9px 14px;border-radius:10px;text-decoration:none}main{max-width:950px;margin:auto;padding:28px 5%}.box,.result{background:#fffdf8;border:1px solid #e5ddce;border-radius:20px;padding:22px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.form input,.form button{padding:12px;border-radius:10px;border:1px solid #ddd}.form button{background:#075c46;color:#fff;border:0}.result h2{color:#075c46}.ayah{font-family:Georgia,serif;font-size:27px;line-height:2.1;border-bottom:1px solid #e5ddce;padding-bottom:18px}.tafsir{line-height:2.1;font-size:18px;color:#53645e;margin-top:18px}.source{color:#c49a45;font-weight:bold}@media(max-width:600px){.form{grid-template-columns:1fr}.ayah{font-size:22px}}</style><header class="head"><h1>تفسير القرآن الكريم</h1><p>التفسير الميسر داخل موقع مفاتيح القرآن الكريم، دون الحاجة للخروج إلى موقع آخر.</p><a class="back" href="./">← العودة للمصحف</a></header><main><section class="box"><h2>اختر الآية</h2><div class="form"><input id="s" type="number" min="1" max="114" value="1" placeholder="رقم السورة"><input id="a" type="number" min="1" value="1" placeholder="رقم الآية"><button onclick="loadTafsir()">عرض التفسير</button></div></section><section id="out" class="result"><p>اكتب رقم السورة والآية ثم اضغط «عرض التفسير».</p></section></main><script>async function loadTafsir(){let s=+document.getElementById('s').value,a=+document.getElementById('a').value,out=document.getElementById('out');out.innerHTML='<p>جاري تحميل الآية والتفسير…</p>';try{let q=await fetch('https://api.alquran.cloud/v1/ayah/'+s+':'+a+'/quran-uthmani');let qj=await q.json();let t=await fetch('https://api.quran-tafseer.com/tafseer/1/'+s+'/'+a);let tj=await t.json();out.innerHTML='<h2>سورة '+qj.data.surah.name+' — الآية '+a+'</h2><div class="ayah">'+qj.data.text+' ﴿'+a+'﴾</div><div class="tafsir"><span class="source">التفسير الميسر</span><br>'+tj.text+'</div>'}catch(e){out.innerHTML='<p>تعذر تحميل التفسير. تأكد من رقم السورة والآية وحاول مرة أخرى.</p>'}}</script></html>
