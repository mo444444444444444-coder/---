<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفاتيح القرآن الكريم</title><style>body{margin:0;background:#f6f1e5;color:#18382f;font-family:Tahoma,Arial,sans-serif}.top{background:#073b2f;color:#fff;padding:18px 5%}.wrap{max-width:1100px;margin:auto;padding:25px 5%}.hero{text-align:center;padding:45px 0}.hero h1{font:900 54px Georgia;color:#0b5b46}.hero span{color:#c69b4d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fffdf8;border:1px solid #dfd2b9;border-radius:18px;padding:18px}.btn{background:#0b5b46;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.q{font:25px/2.4 Georgia;background:#fffaf0;border:1px solid #cdbb98;border-radius:12px;padding:24px;text-align:justify}.out{margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:40px}}</style></head><body><header class="top"><b>﷽ مفاتيح القرآن الكريم</b><div>المنشئ والمطور: محمد شعبان محارب</div></header><main class="wrap"><section class="hero"><h1>مفاتيح <span>القرآن</span> الكريم</h1><p>مصحف • تلاوة • تفسير • بحث • موضوعات • موسوعة إسلامية</p><button class="btn" onclick="openSurah(1)">افتح القرآن الآن</button></section><section><h2>📖 المصحف</h2><div class="grid"><div class="card"><h3>الفاتحة</h3><p>قراءة بالرسم العثماني.</p><button class="btn" onclick="openSurah(1)">فتح</button></div><div class="card"><h3>الرحمن</h3><p>قراءة واستماع.</p><button class="btn" onclick="openSurah(55)">فتح</button></div><div class="card"><h3>بحث قرآني</h3><input id="search" placeholder="الرحمة، التقوى، مصر…" style="padding:10px;width:80%;margin:8px 0"><button class="btn" onclick="searchQ()">بحث</button></div></div><div id="out" class="out"></div></section><section><h2>🧭 موضوعات القرآن</h2><div class="grid" id="topics"></div></section><section><h2>🕌 المعرفة الإسلامية</h2><div class="grid" id="islam"></div></section></main><footer class="top">مفاتيح القرآن الكريم — محمد شعبان محارب</footer><script>const topics=['الرحمة','التقوى','الصبر','الجنة','النار','العدل','الإحسان','الصدق','المغفرة','الدعاء','العلم','الوالدين','التوبة','الآخرة','مصر'];const islam=[['الصلاة','أركان الصلاة والوضوء وأوقاتها وآدابها.'],['الصيام ورمضان','أحكام عامة للصيام وآداب رمضان والقيام والصدقة.'],['الحج والعمرة','الإحرام والطواف والسعي والوقوف بعرفة والرمي والحلق.'],['الحديث','مبادئ الصحيح والحسن والضعيف والإسناد والمتن.'],['علوم القرآن','المكي والمدني وأسباب النزول وجمع المصحف والقراءات والتجويد.'],['السيرة النبوية','حياة النبي ﷺ وأحداث السيرة مع التفريق بين السيرة والقرآن.'],['الغزوات والفتوحات','بدر وأحد والأحزاب والحديبية وفتح مكة وحنين وتبوك والفتوحات.'],['الأخلاق','الرحمة والعدل والصدق والأمانة وبر الوالدين والعفو والإحسان.'],['قصص الأنبياء','قصص آدم ونوح وإبراهيم ويوسف وموسى وعيسى وغيرهم.']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function openSurah(id){const out=document.getElementById('out');out.innerHTML='<div class="card">جارٍ تحميل السورة…</div>';try{const j=await (await fetch('https://api.alquran.cloud/v1/surah/'+id+'/quran-uthmani')).json();const a=j.data.ayahs;out.innerHTML='<div class="q">'+a.map(x=>esc(x.text)+' ﴿'+x.numberInSurah+'﴾').join(' ')+'</div><div class="card"><button class="btn" onclick="playAll()">▶️ تشغيل السورة بالتتابع</button></div>';window.queue=a.map(x=>x.audio);window.i=0}catch(e){out.innerHTML='<div class="card">تعذر تحميل القرآن الآن. تحقق من الإنترنت.</div>'}}function playAll(){if(!queue?.length)return;const next=()=>{if(i>=queue.length)return;window.audio=new Audio(queue[i++]);audio.onended=next;audio.play().catch(()=>{})};next()}async function searchQ(){const q=document.getElementById('search').value.trim();if(!q)return;const out=document.getElementById('out');out.innerHTML='<div class="card">جاري البحث…</div>';try{const j=await (await fetch('https://api.alquran.cloud/v1/search/'+encodeURIComponent(q)+'/all/ar')).json();const m=j.data?.matches||[];out.innerHTML='<div class="card"><h3>آيات: '+esc(q)+'</h3>'+m.slice(0,30).map(x=>'<p><b>'+esc(x.surah.name)+' — '+x.numberInSurah+'</b><br>'+esc(x.text)+'</p>').join('')+'</div>'}catch(e){out.innerHTML='<div class="card">تعذر البحث الآن.</div>'}}topics.forEach(t=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h3>🌿 '+esc(t)+'</h3><p>ابحث عن مواضع الكلمة في القرآن.</p><button class="btn" onclick="document.getElementById(\'search\').value=\''+esc(t)+'\';searchQ()">عرض الآيات</button>';document.getElementById('topics').appendChild(c)});islam.forEach(x=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p>';document.getElementById('islam').appendChild(c)})</script></body></html>
